spring.application.name=CareAssist


spring.datasource.url=jdbc:mysql://localhost:3306/careassist
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

logging.file.name=logs/careassist.log

logging.level.root=INFO
logging.level.com.hexaware.careassist=DEBUG

# JWT Configuration
jwt.secret=CareAssistSecretKeyForJwtAuthentication2026HexawareProject
jwt.expiration=86400000